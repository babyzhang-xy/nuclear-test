ISFJ:['安全壳','温柔守护者','把安心，藏在每一个细节里。','细致 / 体贴 / 守护','你常常先看见他人的需要，再默默把事情安排妥当。你未必站在聚光灯下，却让大家更有安全感。','安全壳是核电厂纵深防御体系中的重要屏障，用于包容放射性物质。','🛡'],

ISFP:['闪烁体','灵感感受家','微小的触动，也值得闪闪发光。','感知 / 审美 / 随性','你对色彩、氛围和细微感受很敏锐。你更愿意用自己的作品与行动表达心意，给日常增添一点美。','闪烁体受到某些辐射作用时能发出光，可用于辐射探测。','💎'],
ESTP:['粒子加速器','即刻行动派','想到就出发，在实践中找到节奏。','敏捷 / 果敢 / 应变','你喜欢直接参与，边做边学。现场越热闹、变化越多，你越容易调动状态，迅速找到突破口。','粒子加速器利用电场加速带电粒子，可用于研究、医疗和工业等领域。','🚀'],
ESFP:['聚变之光','现场发光体','把此刻的快乐，分享给身边的人。','活力 / 表达 / 即兴','你擅长感受现场的气氛，也很会让大家放松下来。你愿意投入当下，让每一次相遇都有值得记住的亮点。','太阳的能量主要来自其内部的核聚变；地面可控核聚变发电仍在研究发展中。','🌟']};
const questions=[
[0,'刚到文化节，你更想怎样开启今天？','先找人聊聊，看看哪里最热闹','先自己逛逛，找到感兴趣的角落'],
[1,'看到一个神秘的装置模型，你先注意到……','它的结构、材料和怎么操作','它背后的原理和未来能做什么'],

[3,'只有一个下午逛文化节，你通常……','提前圈好想去的摊位，按计划走','先出发，看到什么有趣就停下来'],

[2,'你和同伴对路线有分歧，时间又很紧，你倾向于……','比较路程和时间，选更高效的一条','听听各自的想法，尽量让大家都满意'],
[3,'准备一场三分钟的小展示，你更习惯……','先列提纲、分配时间，提前准备好','留一个大方向，现场根据气氛发挥'],
[0,'热闹地玩了一轮后，怎样更能让你恢复状态？','继续和新朋友互动，越聊越有精神','找个安静地方歇一会儿，整理感受'],

const dims=[['E','I','向外连接','向内充电'],['S','N','关注实感','探索可能'],['T','F','逻辑判断','感受判断'],['J','P','偏好计划','拥抱即兴']];let answers=Array(12).fill(null),step=0;const app=document.getElementById('app');
function topView(){window.scrollTo({top:0,behavior:'instant'})}function home(){app.innerHTML=`<section class="hero"><div><div class="eyebrow"><span class="dot"></span> 核能文化节 · 限时好奇实验</div><h1>如果你是一种<br>核能，<em>会是哪一种？</em></h1><p class="intro">是灵感迸发的快中子，还是温柔可靠的安全壳？<br>跟随直觉做选择，发现属于你的能量频率。</p><div class="meta"><span>◷ 约 3 分钟</span><span>☷ 12 道情境题</span><span>✧ 16 种核人格</span></div><button class="primary" onclick="start()">开启我的核能实验 <span>↗</span></button><p class="notice">不考核知识，没有标准答案。选更像自己的那一项就好。</p></div><div class="art" aria-hidden="true"><div class="tag a">好奇心浓度 ↑ 100%</div><div class="atom"><div class="orbit" style="--r:0deg"></div><div class="orbit" style="--r:60deg"></div><div class="orbit" style="--r:120deg"></div><div class="core">•‿•</div></div><div class="tag b">发现你的隐藏能量 ✦</div><div class="artlabel">EVERY PERSONALITY HAS ITS OWN ENERGY</div></div></section><div class="sectionline"><span>16 种能量，没有高低之分</span><span class="small">MEET YOUR ELEMENT</span></div><section class="teasers">${['ENTP','ISFJ','INTJ','ENFP'].map(k=>`<div class="teaser"><div class="icon">${types[k][6]}</div><strong>${types[k][0]} · ${types[k][1]}</strong><p>${types[k][2]}</p></div>`).join('')}</section>`;topView()}
function start(){answers=Array(12).fill(null);step=0;renderQuestion()}function renderQuestion(){const q=questions[step];app.innerHTML=`<section class="panel"><button class="back" onclick="home()">← 返回首页</button><div class="progress" role="progressbar" aria-valuenow="${step+1}" aria-valuemin="0" aria-valuemax="12"><i style="width:${(step+1)/12*100}%"></i></div><div class="qcount">QUESTION ${String(step+1).padStart(2,'0')} / 12</div><h2>${q[1]}</h2><p class="hint">不用纠结，选择第一直觉中更像你的回答。</p>${[0,1].map(i=>`<button class="option ${answers[step]===i?'selected':''}" aria-pressed="${answers[step]===i}" onclick="choose(${i})"><span class="letter">${i?'B':'A'}</span><span>${q[i+2]}</span></button>`).join('')}<div class="qnav"><button class="back" ${step===0?'disabled':''} onclick="prev()">← 上一题</button><button class="primary" ${answers[step]===null?'disabled':''} onclick="next()">${step===11?'查看我的核人格':'下一题'} →</button></div><p class="notice">每种选择都有自己的能量。已选择的答案可返回修改。</p></section>`;topView()}function choose(i){answers[step]=i;renderQuestion()}function prev(){if(step>0){step--;renderQuestion()}}function next(){if(answers[step]===null)return;if(step<11){step++;renderQuestion()}else result(getType(),true)}function scores(){return dims.map((_,d)=>questions.reduce((n,q,i)=>n+(q[0]===d&&answers[i]===0?1:0),0))}function getType(){return scores().map((s,i)=>dims[i][s>=2?0:1]).join('')}
function result(k,actual=false){const t=types[k];app.innerHTML=`<section class="result"><button class="back" onclick="${actual?'home()':'showAtlas()'}">← ${actual?'返回首页':'返回人格图鉴'}</button><article class="resultcard"><div class="eyebrow">${actual?'实验完成 · 你的能量档案':'核人格图鉴 · 能量档案'}</div><p class="type">${k} <span style="float:right;font-size:35px">${t[6]}</span></p><h2>${t[0]}</h2><div class="eyebrow">${t[1]}</div><p class="quote">“${t[2]}”</p><div class="badges">${t[3].split(' / ').map(x=>`<span>${x}</span>`).join('')}</div><p class="resultbody">${t[4]}</p><div class="fact"><b>一口核科普 · ${t[0]}</b><br>${t[5]}</div><p class="notice">人格与核能概念为创意联想，不代表物理性质或职业适配。</p></article>${actual?`<div class="bars"><b>你的四维能量倾向</b><p class="notice">每维3题，以下显示选择次数，不是心理学量表得分。</p>${scores().map((s,i)=>`<div class="barrow"><div class="barlabels"><span>${dims[i][0]} ${dims[i][2]} · ${s}/3</span><span>${dims[i][3]} ${dims[i][1]} · ${3-s}/3</span></div><div class="track"><i style="width:${s/3*100}%"></i></div></div>`).join('')}</div>`:''}<div class="actions">${actual?'<button class="primary" onclick="saveCard()">保存人格卡片 ↓</button>':''}<button class="nav" onclick="start()">${actual?'下一位测试 / 再测一次':'测测我的核人格'} ↗</button><button class="nav" onclick="showAtlas()">查看16型图鉴</button></div><p class="notice">这是借用 MBTI 四维形式的文化节趣味测试，不是官方 MBTI 测评，也不用于心理诊断。所有答案仅在本页内存中处理，刷新即清空。</p></section>`;topView();window.currentType=k}
function showAtlas(){app.innerHTML=`<section><button class="back" onclick="home()">← 返回首页</button><div class="eyebrow" style="margin-top:25px">THE 16 ENERGY PROFILES</div><h1 style="font-size:42px;letter-spacing:-1px">找到你的能量同频者</h1><p class="intro">16种核人格，每一种都有自己的发光方式。点击卡片探索。</p><div class="grid16">${Object.entries(types).map(([k,t])=>`<button class="person" onclick="result('${k}')"><span style="font-size:26px">${t[6]}</span><div class="small" style="margin-top:12px">${k}</div><strong>${t[0]}</strong><small>${t[1]}</small></button>`).join('')}</div><div class="actions"><button class="primary" onclick="start()">测测我的核人格 ↗</button></div></section>`;topView()}
function saveCard(){const k=window.currentType,t=types[k],c=document.createElement('canvas');c.width=900;c.height=1160;const x=c.getContext('2d');x.fillStyle='#f6f4e9';x.fillRect(0,0,900,1160);x.fillStyle='#153e37';x.fillRect(40,40,820,1080);x.fillStyle='#b8ec6a';x.font='22px sans-serif';x.fillText('核能人格研究所  /  NUCLEAR PERSONALITY LAB',85,110);x.font='90px monospace';x.fillText(k,80,260);x.fillStyle='#f6f4e9';x.font='bold 72px sans-serif';x.fillText(t[0],80,370);x.font='30px sans-serif';x.fillText(t[1],85,435);x.fillStyle='#b8ec6a';x.font='24px sans-serif';x.fillText(t[3],85,505);function wrap(text,y,font,size,color){x.font=font;x.fillStyle=color;let line='',yy=y;for(const ch of text){if(x.measureText(line+ch).width>710){x.fillText(line,85,yy);yy+=size;line=''}line+=ch}x.fillText(line,85,yy);return yy}wrap('“'+t[2]+'”',590,'32px sans-serif',49,'#f6f4e9');wrap(t[4],720,'25px sans-serif',42,'#f6f4e9');x.fillStyle='#b8ec6a';x.font='21px sans-serif';x.fillText('核能文化节 · 让好奇心发生链式反应',85,1005);x.fillStyle='#c4d1ba';x.font='18px sans-serif';x.fillText('文化节趣味测试 · 非专业心理测评',85,1060);c.toBlob(b=>{if(!b){toast('请直接截图保存结果');return}const a=document.createElement('a'),url=URL.createObjectURL(b);a.href=url;a.download='核人格-'+k+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('卡片已生成；手机也可截图保存')},'image/png')}function toast(s){const e=document.getElementById('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',3000)}home();
</script></body></html>
