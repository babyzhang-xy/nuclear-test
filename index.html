ENFJ:['慢化剂','温暖连接者','让不同的节奏，找到共同的方向。','共情 / 鼓舞 / 协调','你擅长让人感到被理解，也愿意帮助伙伴发挥长处。你让团队的气氛更柔和，让合作更顺畅。','慢化剂通过中子与原子核的碰撞降低中子能量，常见的有水、重水和石墨。','〰'],

ISTJ:['控制棒','可靠守序者','稳稳把关，就是你的超能力。','严谨 / 责任 / 秩序','你习惯认真核对细节，说到就会尽力做到。面对复杂任务，你用清晰的步骤和稳定的行动让人放心。','控制棒通过吸收中子来调节反应堆的反应性。','▥'],

ISFP:['闪烁体','灵感感受家','微小的触动，也值得闪闪发光。','感知 / 审美 / 随性','你对色彩、氛围和细微感受很敏锐。你更愿意用自己的作品与行动表达心意，给日常增添一点美。','闪烁体受到某些辐射作用时能发出光，可用于辐射探测。','💎'],
ESTP:['粒子加速器','即刻行动派','想到就出发，在实践中找到节奏。','敏捷 / 果敢 / 应变','你喜欢直接参与，边做边学。现场越热闹、变化越多，你越容易调动状态，迅速找到突破口。','粒子加速器利用电场加速带电粒子，可用于研究、医疗和工业等领域。','🚀'],
ESFP:['聚变之光','现场发光体','把此刻的快乐，分享给身边的人。','活力 / 表达 / 即兴','你擅长感受现场的气氛，也很会让大家放松下来。你愿意投入当下，让每一次相遇都有值得记住的亮点。','太阳的能量主要来自其内部的核聚变；地面可控核聚变发电仍在研究发展中。','🌟']};

[1,'看到一个神秘的装置模型，你先注意到……','它的结构、材料和怎么操作','它背后的原理和未来能做什么'],

[2,'你和同伴对路线有分歧，时间又很紧，你倾向于……','比较路程和时间，选更高效的一条','听听各自的想法，尽量让大家都满意'],

questions.push(...[[0,"加入一个不太熟悉的小组时，你通常……","先听大家交流，熟悉后再加入","主动自我介绍，顺势打开话题",1],[1,"回想一次有趣的活动，你更容易记住……","现场发生的细节和具体体验","它带来的启发和新的联想"],[2,"分配团队有限的奖励时，你更倾向于……","结合每个人的处境和付出感受","按照事先约定的一致标准",1],[3,"手头有一项下周截止的任务，你通常……","先探索不同做法，临近截止再集中完成","尽早拆分步骤，按进度逐项完成",1],[0,"一个想法还没成形时，你更习惯……","边与别人讨论，边理清思路","先独自想清楚，再向别人表达"],[1,"面对一项新任务，你更愿意……","尝试一种新思路，看看有没有不同可能","从熟悉、验证过的办法入手",1],[2,"讨论一个有争议的决定时，你更关注……","判断依据是否前后一致","决定是否符合自己重视的价值"],[3,"安排周末的一天，你更喜欢……","给临时兴起的想法留足空间","提前定好主要安排",1],[0,"可以自由选择工作方式时，你更喜欢……","独立专注一段时间，再集中交流","和伙伴保持互动，随时交换想法",1],[1,"听别人介绍一个方案时，你更期待……","先听整体构想和发展方向","先听具体例子和执行细节",1],[2,"需要拒绝朋友一个不合适的请求时，你更自然地……","先说明自己的原则和实际理由","先表达理解，再顾及对方感受地说明"],[3,"计划一次短途出行，你更愿意……","提前确认路线和时间，减少悬而未决","只定必要事项，其他到时再决定"]]);
const dims=[['E','I','向外连接','向内充电'],['S','N','关注实感','探索可能'],['T','F','逻辑判断','感受判断'],['J','P','偏好计划','拥抱即兴']];let tieChoices={},answers=Array(questions.length).fill(null),step=0;const app=document.getElementById('app');
function topView(){window.scrollTo({top:0,behavior:'instant'})}function home(){app.innerHTML=`<section class="hero"><div><div class="eyebrow"><span class="dot"></span> 核能文化节 · 限时好奇实验</div><h1>如果你是一种<br>核能，<em>会是哪一种？</em></h1><p class="intro">是灵感迸发的快中子，还是温柔可靠的安全壳？<br>跟随直觉做选择，发现属于你的能量频率。</p><div class="meta"><span>◷ 约 3–4 分钟</span><span>☷ 24 道情境题</span><span>✧ 16 种核人格</span></div><button class="primary" onclick="start()">开启我的核能实验 <span>↗</span></button><p class="notice">24道基础题 · 每维6题 · 倾向持平时增加简短校准题。</p></div><div class="art" aria-hidden="true"><div class="tag a">好奇心浓度 ↑ 100%</div><div class="atom"><div class="orbit" style="--r:0deg"></div><div class="orbit" style="--r:60deg"></div><div class="orbit" style="--r:120deg"></div><div class="core">•‿•</div></div><div class="tag b">发现你的隐藏能量 ✦</div><div class="artlabel">EVERY PERSONALITY HAS ITS OWN ENERGY</div></div></section><div class="sectionline"><span>16 种能量，没有高低之分</span><span class="small">MEET YOUR ELEMENT</span></div><section class="teasers">${['ENTP','ISFJ','INTJ','ENFP'].map(k=>`<div class="teaser"><div class="icon">${types[k][6]}</div><strong>${types[k][0]} · ${types[k][1]}</strong><p>${types[k][2]}</p></div>`).join('')}</section>`;topView()}
function start(){tieChoices={};answers=Array(questions.length).fill(null);step=0;renderQuestion()}function renderQuestion(){const q=questions[step];app.innerHTML=`<section class="panel"><button class="back" onclick="home()">← 返回首页</button><div class="progress" role="progressbar" aria-valuenow="${step+1}" aria-valuemin="0" aria-valuemax="${questions.length}"><i style="width:${(step+1)/questions.length*100}%"></i></div><div class="qcount">QUESTION ${String(step+1).padStart(2,'0')} / ${questions.length}</div><h2>${q[1]}</h2><p class="hint">不用纠结，选择第一直觉中更像你的回答。</p>${[0,1].map(i=>`<button class="option ${answers[step]===i?'selected':''}" aria-pressed="${answers[step]===i}" onclick="choose(${i})"><span class="letter">${i?'B':'A'}</span><span>${q[i+2]}</span></button>`).join('')}<div class="qnav"><button class="back" ${step===0?'disabled':''} onclick="prev()">← 上一题</button><button class="primary" ${answers[step]===null?'disabled':''} onclick="next()">${step===questions.length-1?'查看我的核人格':'下一题'} →</button></div><p class="notice">每种选择都有自己的能量。已选择的答案可返回修改。</p></section>`;topView()}function choose(i){tieChoices={};answers[step]=i;renderQuestion()}function prev(){if(step>0){step--;renderQuestion()}}function next(){if(answers[step]===null)return;if(step<questions.length-1){step++;renderQuestion()}else resolveTies()}function scores(){return dims.map((_,d)=>questions.reduce((n,q,i)=>n+(q[0]===d&&answers[i]===(q[4]||0)?1:0),0))}function getType(){return scores().map((s,i)=>dims[i][s===3?tieChoices[i]:(s>3?0:1)]).join('')}
function resolveTies(){const d=scores().findIndex((s,i)=>s===3&&tieChoices[i]===undefined);if(d<0){result(getType(),true);return}const prompts=['通常哪种方式更能让你恢复精力？','面对新事物，你更自然地从哪里入手？','必须作决定时，你更常优先依靠什么？','安排日常时，哪种状态让你更自在？'];app.innerHTML=`<section class="panel"><div class="qcount">CALIBRATION / 倾向校准</div><h2>${prompts[d]}</h2><p class="hint">这一维的6题选择各占一半。再选一次更接近日常的偏好，帮助生成档案。</p>${[0,1].map(i=>`<button class="option" onclick="tieChoices[${d}]=${i};resolveTies()"><span class="letter">${i?'B':'A'}</span>${dims[d][i+2]}</button>`).join('')}<button class="back" onclick="step=questions.length-1;renderQuestion()">← 返回最后一题修改</button></section>`;topView()}
function result(k,actual=false){const t=types[k];app.innerHTML=`<section class="result"><button class="back" onclick="${actual?'home()':'showAtlas()'}">← ${actual?'返回首页':'返回人格图鉴'}</button><article class="resultcard"><div class="eyebrow">${actual?'实验完成 · 你的能量档案':'核人格图鉴 · 能量档案'}</div><p class="type">${k} <span style="float:right;font-size:35px">${t[6]}</span></p><h2>${t[0]}</h2><div class="eyebrow">${t[1]}</div><p class="quote">“${t[2]}”</p><div class="badges">${t[3].split(' / ').map(x=>`<span>${x}</span>`).join('')}</div><p class="resultbody">${t[4]}</p><div class="fact"><b>一口核科普 · ${t[0]}</b><br>${t[5]}</div><p class="notice">人格与核能概念为创意联想，不代表物理性质或职业适配。</p></article>${actual?`<div class="bars"><b>你的四维能量倾向</b><p class="notice">每维6题，条形表示基础题的选择比例。3:3为两端接近，类型按补充选择生成。</p>${scores().map((s,i)=>`<div class="barrow"><div class="barlabels"><span>${dims[i][0]} ${dims[i][2]} · ${s}/6</span><span>${dims[i][3]} ${dims[i][1]} · ${6-s}/6</span></div><div class="track"><i style="width:${s/6*100}%"></i></div></div>`).join('')}</div>`:''}<div class="actions">${actual?'<button class="primary" onclick="saveCard()">保存人格卡片 ↓</button>':''}<button class="nav" onclick="start()">${actual?'下一位测试 / 再测一次':'测测我的核人格'} ↗</button><button class="nav" onclick="showAtlas()">查看16型图鉴</button></div><p class="notice">这是借用 MBTI 四维形式的文化节趣味测试，不是官方 MBTI 测评，也不用于心理诊断。所有答案仅在本页内存中处理，刷新即清空。</p></section>`;topView();window.currentType=k}
function showAtlas(){app.innerHTML=`<section><button class="back" onclick="home()">← 返回首页</button><div class="eyebrow" style="margin-top:25px">THE 16 ENERGY PROFILES</div><h1 style="font-size:42px;letter-spacing:-1px">找到你的能量同频者</h1><p class="intro">16种核人格，每一种都有自己的发光方式。点击卡片探索。</p><div class="grid16">${Object.entries(types).map(([k,t])=>`<button class="person" onclick="result('${k}')"><span style="font-size:26px">${t[6]}</span><div class="small" style="margin-top:12px">${k}</div><strong>${t[0]}</strong><small>${t[1]}</small></button>`).join('')}</div><div class="actions"><button class="primary" onclick="start()">测测我的核人格 ↗</button></div></section>`;topView()}
function saveCard(){const k=window.currentType,t=types[k],c=document.createElement('canvas');c.width=900;c.height=1160;const x=c.getContext('2d');x.fillStyle='#eef0ff';x.fillRect(0,0,900,1160);x.fillStyle='#16162b';x.fillRect(40,40,820,1080);x.fillStyle='#baff5a';x.font='22px sans-serif';x.fillText('核能人格研究所  /  NUCLEAR PERSONALITY LAB',85,110);x.font='90px monospace';x.fillText(k,80,260);x.fillStyle='#eef0ff';x.font='bold 72px sans-serif';x.fillText(t[0],80,370);x.font='30px sans-serif';x.fillText(t[1],85,435);x.fillStyle='#baff5a';x.font='24px sans-serif';x.fillText(t[3],85,505);function wrap(text,y,font,size,color){x.font=font;x.fillStyle=color;let line='',yy=y;for(const ch of text){if(x.measureText(line+ch).width>710){x.fillText(line,85,yy);yy+=size;line=''}line+=ch}x.fillText(line,85,yy);return yy}wrap('“'+t[2]+'”',590,'32px sans-serif',49,'#eef0ff');wrap(t[4],720,'25px sans-serif',42,'#eef0ff');x.fillStyle='#baff5a';x.font='21px sans-serif';x.fillText('核能文化节 · 让好奇心发生链式反应',85,1005);x.fillStyle='#b9afd5';x.font='18px sans-serif';x.fillText('文化节趣味测试 · 非专业心理测评',85,1060);c.toBlob(b=>{if(!b){toast('请直接截图保存结果');return}const a=document.createElement('a'),url=URL.createObjectURL(b);a.href=url;a.download='核人格-'+k+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('卡片已生成；手机也可截图保存')},'image/png')}function toast(s){const e=document.getElementById('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',3000)}home();
</script></body></html>
